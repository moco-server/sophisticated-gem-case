[versions]
kotlin = "2.0.21"
moddev = "2.0.148"
kff = "5.5.0"
# KFFの範囲指定がNeoForge固定のloaderと異なる同名JPMS moduleを選ばないようにする。
fml = { strictly = "4.0.44" }
detekt = "1.23.8"
ktlint-plugin = "12.1.2"
ktlint = "1.5.0"
junit = "5.11.4"
asm = "9.7.1"
apotheosis = "1.21.1-8.9.0"
sophisticated-backpacks = "1.21.1-3.26.6.2174"
sophisticated-core = "1.21.1-1.5.2.2343"
placebo = "1.21.1-9.9.2"
apothic-attributes = "1.21.1-2.10.0"
apothic-spawners = "1.21.1-1.4.0"
apothic-enchanting = "1.21.1-1.6.2"
patchouli = "1.21-87-neoforge"
# 同じ版番号のFabric成果物を避け、NeoForge 19.51.0.418のModrinth版IDで固定する。
jei = "ufHUqt9b"
gateways = "1.21.1-5.1.0"
[libraries]
kff = { module = "thedarkcolour:kotlinforforge-neoforge", version.ref = "kff" }
fml-loader = { module = "net.neoforged.fancymodloader:loader", version.ref = "fml" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
apotheosis = { module = "maven.modrinth:apotheosis", version.ref = "apotheosis" }
sophisticated-backpacks = { module = "maven.modrinth:sophisticated-backpacks", version.ref = "sophisticated-backpacks" }
sophisticated-core = { module = "maven.modrinth:sophisticated-core", version.ref = "sophisticated-core" }
placebo = { module = "maven.modrinth:placebo", version.ref = "placebo" }
apothic-attributes = { module = "maven.modrinth:apothic-attributes", version.ref = "apothic-attributes" }
apothic-spawners = { module = "maven.modrinth:apothic-spawners", version.ref = "apothic-spawners" }
apothic-enchanting = { module = "maven.modrinth:apothic-enchanting", version.ref = "apothic-enchanting" }
patchouli = { module = "maven.modrinth:patchouli", version.ref = "patchouli" }
jei = { module = "maven.modrinth:jei", version.ref = "jei" }
gateways = { module = "maven.modrinth:gateways-to-eternity", version.ref = "gateways" }
[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
