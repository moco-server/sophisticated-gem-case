name: 機能提案
description: 目的・代案・受け入れ条件を整理する
body:
  - type: textarea
    id: purpose
    attributes:
      label: 解決したいこと
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 提案・代案・トレードオフ
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 対象版、side、保存・素材消費の成功／失敗条件
