modLoader="kotlinforforge"
loaderVersion="[5.5,)"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
displayURL="${mod_repo_url}"
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.252,21.2)"
side="BOTH"
[[dependencies.${mod_id}]]
modId="apotheosis"
type="required"
versionRange="[${apotheosis_version}]"
side="BOTH"
[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
type="required"
versionRange="[${backpacks_version}]"
side="BOTH"
[[dependencies.${mod_id}]]
modId="sophisticatedcore"
type="required"
versionRange="[${core_version}]"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
side="BOTH"

[[mixins]]
config="sophisticated_gem_case.mixins.json"
